name: CI

on:
  # Branch-filtered so a pushed branch with an open pull request is checked
  # once, as the pull request, not twice. develop is where deploys come from
  # (deploy.yml runs after this workflow succeeds on a develop push).
  push:
    branches: [develop, main]
  pull_request:

# One run per event and commit. 0602d99 was checked twice (runs 24 and 25):
# GitHub recorded two push events for the same ref update 28730e9→0602d99 in
# the same second (repos/…/activity, ids 47339677051 and 47339678237), and
# each push event starts its own run. Same sha, same event → the newer run
# cancels the older one. A different sha never shares a group, so no commit
# goes unchecked. Safe to cancel: CI writes nothing, and deploy.yml starts only
# from a run that concluded success.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.sha }}
  cancel-in-progress: true

# Checkout only. Neither job needs a secret: the database job's PostgreSQL is a
# service container on the runner, and no step reaches GitHub's API.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Before the checks, not after. `next build` regenerates next-env.d.ts,
      # which the linter and the type-checker then read — so a runner that lints
      # first can fail on a file the build was about to write. The build needs no
      # database — every page that reads one is marked request-time — but it does
      # evaluate each route module to read its segment config, and src/db/client.ts
      # validates DATABASE_URL as it loads. Without a value this step failed on
      # every push from ffded2e on. The placeholder does what the Dockerfile's
      # does: it only has to parse. Port 9 has nothing listening, so a
      # connection attempt would fail loudly rather than reach anything.
      #
      # Step-scoped on purpose. Set for the job, it would also un-skip every
      # database-backed suite in `bun run ci` below, which would then fail
      # against a database that is not there.
      - run: bun run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:9/build

      # The migration boundary scan, lint, type-check, and tests — the same
      # single command a developer runs locally, so the two cannot drift.
      # No database and no secret are involved: every check reads files.
      - run: bun run ci

  # The database-backed suites, which the job above skips by having no URL.
  # The same disposable PostgreSQL a developer runs locally (README, Testing):
  # postgres:17, trust auth, port 55432, database agentdock_test — the only
  # shape src/db/testDatabase.ts lets a test connect to. Nothing here can name
  # the deployment's database: no secret is read, and the URL is the literal
  # below. The service container is removed when the job ends.
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agentdock_test
          POSTGRES_HOST_AUTH_METHOD: trust
        # Loopback only. 55432 sits inside Linux's default ephemeral range
        # (32768–60999), and on CI run 39748062131 the e2e job's 0.0.0.0:55432
        # failed "address already in use" before any step ran. The likely
        # holder, by elimination (no container and no step had started), is an
        # outgoing connection using that local port on the runner's own address.
        # Bound to 127.0.0.1, such a socket no longer conflicts (reproduced
        # locally 2026-10-22, Docker 29.9). The port stays 55432 because
        # src/db/testDatabase.ts admits no other — a dynamic host port would mean
        # loosening that allowlist.
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentdock_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://agentdock_app@127.0.0.1:55432/agentdock_test
      # A missing URL fails the run instead of skipping every suite green.
      REQUIRE_TEST_DATABASE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # Role, both schemas and pg_trgm, as a deployment's superuser would.
      - run: bun run db:test:bootstrap

      # agentdock_test from schema.ts, which every suite writes to; then the
      # reviewed drizzle/ files into agentdock, which src/db/migrations.test.ts
      # compares against it.
      - run: bun run db:test:setup
      - run: bun run db:test:migrations

      - run: bun run test

  # The browser journeys (e2e/journeys.spec.ts) against the production build,
  # on the same disposable PostgreSQL as the job above, seeded offline from the
  # committed fixtures — no secret, no GitHub request, nothing that can name the
  # deployment's database (playwright.config.ts refuses any URL the test
  # allowlist does not). In this workflow, so deploy.yml — which starts only from
  # a CI run that concluded success — never ships a build the journeys failed.
  #
  # Measured locally 2026-10-22: Chromium headless shell is a 273 MB download
  # (6.4 s on a home line), the build 6.6 s, the seed under 2 s, the fifteen
  # journeys 7.7 s. A journey retries once on CI; one that passes on its retry is
  # reported flaky, not passed, so an unsteady runner and a regression read
  # differently in the summary.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: agentdock_test
          POSTGRES_HOST_AUTH_METHOD: trust
        # Loopback only, for the reason in the database job above.
        ports:
          - 127.0.0.1:55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d agentdock_test"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      TEST_DATABASE_URL: postgresql://agentdock_app@127.0.0.1:55432/agentdock_test
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - run: bun install --frozen-lockfile

      # The reviewed drizzle/ migrations into `agentdock`, the schema a
      # deployment runs, then the fixtures through the real pipeline.
      - run: bun run db:test:bootstrap
      - run: bun run db:test:migrations
      - run: bun run e2e:seed

      # Same placeholder as the check job's build: it only has to parse.
      - run: bun run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:9/build

      # Keyed on the lockfile, which pins @playwright/test and so the browser
      # revision. A hit skips the download; the system libraries are installed
      # either way, since they are not in the cache.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}
      - run: bunx playwright install --with-deps --only-shell chromium

      - run: bun run test:e2e

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-traces
          path: test-results/
          retention-days: 7
