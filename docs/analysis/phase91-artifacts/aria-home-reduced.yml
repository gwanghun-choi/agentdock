  - region "How a repository gets indexed":
    - heading "How a repository gets indexed" [level=2]
    - paragraph: "AgentDock discovers repositories on its own, twice a day. There is no submission form: nothing is added by request."
    - list:
      - listitem:
        - paragraph: A public repository
        - paragraph: A registry, a curated seed list, GitHub's topic search.
      - listitem:
        - paragraph: The files that declare an artifact
        - list:
